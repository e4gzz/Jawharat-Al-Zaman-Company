<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم والعداد التنازلي</title>
    <!-- استدعاء مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }
        .container {
            width: 100%; max-width: 600px;
            background: #1e293b; padding: 25px;
            border-radius: 20px; border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-top: 20px;
        }
        h2, h3 { color: #6366f1; margin-top: 0; }
        p { color: #94a3b8; font-size: 14px; }
        input, button {
            width: 100%; padding: 10px 14px; margin-bottom: 10px;
            background: #0b0f19; border: 1px solid #334155;
            color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }
        input:focus { outline: none; border-color: #6366f1; }
        button {
            background: #6366f1; border: none; cursor: pointer;
            font-weight: 600; transition: background 0.2s;
        }
        button:hover { background: #4f46e5; }
        .logout-btn { background: #ef4444; margin-top: 20px; }
        .logout-btn:hover { background: #dc2626; }
        .user-info { background: #0b0f19; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="container">
        <h2>لوحة التحكم الرئيسية</h2>
        
        <!-- معلومات المستخدم الحالي -->
        <div class="user-info" id="userInfoBox">
            جاري التحميل...
        </div>

        <!-- قسم إدارة حسابات المشاهدة (يظهر للمدير فقط) -->
        <div id="adminUserManagement" style="display:none;">
            <h3>إدارة حسابات المشاهدة</h3>
            <input type="text" id="newUsername" placeholder="اسم مستخدم المشاهد (بالإنجليزية مثلاً)" autocomplete="off">
            <input type="text" id="newPassword" placeholder="كلمة المرور">
            <input type="text" id="newName" placeholder="اسم أو وصف الحساب">
            <button onclick="createViewerAccount()">إضافة حساب مشاهد جديد</button>

            <h3 style="margin-top: 20px;">الحسابات الحالية على السيرفر</h3>
            <div id="viewersList" style="color: #94a3b8; font-size: 14px;">
                جاري تحميل الحسابات...
            </div>
        </div>

        <!-- قسم المشاهد العادي -->
        <div id="viewerSection" style="display:none;">
            <p>مرحباً بك في لوحة المشاهدة. يمكنك متابعة التحديثات هنا.</p>
        </div>

        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <script>
        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBraw98K7uLeQ5p7xmgn88x2jczO2EtzXM",
            authDomain: "jawharat-al-zaman-company.firebaseapp.com",
            databaseURL: "https://jawharat-al-zaman-company-default-rtdb.firebaseio.com",
            projectId: "jawharat-al-zaman-company",
            storageBucket: "jawharat-al-zaman-company.firebasestorage.app",
            messagingSenderId: "117069348206",
            appId: "1:117069348206:web:1d8e3c9c365557d02b557f",
            measurementId: "G-DPKEELR14J"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // التحقق من تسجيل الدخول عند فتح الصفحة
        let loggedUser = JSON.parse(localStorage.getItem('current_logged_user_v10'));
        
        if (!loggedUser) {
            // إذا لم يكن مسجلاً، أعده لصفحة الدخول
            window.location.replace('index.html');
        } else {
            let infoBox = document.getElementById('userInfoBox');
            infoBox.innerHTML = `مرحباً، <b>${loggedUser.name || loggedUser.username}</b> (${loggedUser.role === 'admin' ? 'مدير النظام' : 'مشاهد'})`;

            if (loggedUser.role === 'admin') {
                document.getElementById('adminUserManagement').style.display = 'block';
                loadViewersList();
            } else {
                document.getElementById('viewerSection').style.display = 'block';
            }
        }

        // دالة إضافة حساب مشاهد جديد وتخزينه في Firebase
        function addNewViewer(username, password, name) {
            db.ref('users/' + username).set({
                pass: password,
                role: 'viewer',
                name: name
            }).then(() => {
                alert('تمت إضافة حساب المشاهد بنجاح وتزامن مع السيرفر!');
                document.getElementById('newUsername').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('newName').value = '';
            }).catch((error) => {
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
            });
        }

        function createViewerAccount() {
            let u = document.getElementById('newUsername').value.trim();
            let p = document.getElementById('newPassword').value.trim();
            let n = document.getElementById('newName').value.trim();

            if (!u || !p) {
                alert('الرجاء إدخال اسم المستخدم وكلمة المرور على الأقل');
                return;
            }
            addNewViewer(u, p, n || 'مستخدم مشاهد');
        }

        // جلب وعرض حسابات المشاهدة من السيرفر مباشرة للمدير
        function loadViewersList() {
            db.ref('users').on('value', (snapshot) => {
                let users = snapshot.val();
                let listDiv = document.getElementById('viewersList');
                listDiv.innerHTML = '';

                if (!users) {
                    listDiv.innerHTML = 'لا توجد حسابات مسجلة.';
                    return;
                }

                let html = '<ul style="list-style: none; padding: 0;">';
                for (let username in users) {
                    let user = users[username];
                    if (user.role === 'viewer') {
                        html += `<li style="display: flex; justify-content: space-between; align-items: center; background: #0b0f19; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #334155;">
                            <span><b>${username}</b> (${user.name || 'بدون اسم'}) - كلمة المرور: ${user.pass}</span>
                            <button onclick="deleteViewer('${username}')" style="background: #ef4444; width: auto; padding: 5px 10px; margin: 0; font-size: 12px;">حذف</button>
                        </li>`;
                    }
                }
                html += '</ul>';
                listDiv.innerHTML = html;
            });
        }

        // دالة حذف حساب مشاهد من السيرفر
        function deleteViewer(username) {
            if (confirm(`هل أنت متأكد من حذف الحساب "${username}"؟`)) {
                db.ref('users/' + username).remove().then(() => {
                    alert('تم الحذف بنجاح');
                });
            }
        }

        // تسجيل الخروج
        function logout() {
            localStorage.removeItem('current_logged_user_v10');
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
