<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العداد التنازلي للبروفايلات</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --sidebar-bg: #111827;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main); color: var(--text-main);
            margin: 0; padding: 0; display: flex; height: 100vh; flex-direction: row; overflow: hidden;
        }
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.98); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-card {
            background: var(--card-bg); padding: 40px; border-radius: 20px;
            border: 1px solid var(--border-color); width: 380px; text-align: center;
        }
        .sidebar {
            width: 320px; background: var(--sidebar-bg); border-left: 1px solid var(--border-color);
            padding: 24px; display: flex; flex-direction: column; box-sizing: border-box; flex-shrink: 0;
        }
        .profiles-list { flex: 1; overflow-y: auto; margin-bottom: 10px; }
        .profile-item, .user-item, .menu-item {
            padding: 12px 14px; background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-color);
            border-radius: 10px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .profile-item.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.2); }
        .main-container {
            flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;
            background: radial-gradient(circle at center, #131c31 0%, #0b0f19 100%); overflow-y: auto;
        }
        .card {
            background: var(--card-bg); padding: 30px; border-radius: 20px;
            border: 1px solid var(--border-color); text-align: center; width: 480px;
        }
        .big-number { font-size: 70px; font-weight: 800; color: #10b981; margin: 10px 0; }
        input, select, button {
            width: 100%; padding: 10px 14px; margin-bottom: 8px;
            background: var(--bg-main); border: 1px solid var(--border-color); color: white; border-radius: 8px; box-sizing: border-box;
        }
        button { background: var(--primary); border: none; cursor: pointer; font-weight: 600; }
        .btn-secondary { background: #334155; }
        .btn-danger { background: #ef4444; }
        .admin-only { display: none; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2 style="color: var(--primary);">تسجيل الدخول</h2>
            <input type="text" id="loginUser" placeholder="اسم المستخدم" autocomplete="off">
            <input type="password" id="loginPass" placeholder="كلمة المرور">
            <button onclick="handleLogin()" style="margin-top: 10px;">دخول</button>
            <div id="loginError" style="color: #ef4444; font-size: 12px; margin-top: 10px;"></div>
        </div>
    </div>

    <div class="sidebar">
        <h3 style="color: var(--primary); text-align: center;">البروفايلات</h3>
        <div class="profiles-list" id="listContainer"></div>
        <div id="adminBottomMenu" class="admin-only" style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: auto; display: flex; flex-direction: column; gap: 6px;">
            <div class="menu-item" onclick="toggleView('create')"><span>➕ إنشاء بروفايل جديد</span></div>
            <div class="menu-item" onclick="toggleView('settings')"><span>⚙️ الإعدادات والصلاحيات</span></div>
        </div>
        <button class="btn-secondary" onclick="logout()" style="margin-top: 8px;">تسجيل خروج</button>
    </div>

    <div class="main-container">
        <div class="card" id="countdownCardView">
            <h2 id="activeTitle" style="color: var(--primary);">جاري التحميل...</h2>
            <div style="color: var(--text-muted); font-size: 14px;">الأيام المتبقية</div>
            <div class="big-number" id="daysDisplay">0</div>
            <div id="userRoleIndicator"></div>

            <div id="adminSettingsSection" class="admin-only" style="margin-top: 15px; text-align: right; background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 10px;">
                <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">تعديل الأيام:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="daysInput" min="1" max="365" value="92" style="margin-bottom:0;">
                    <button onclick="updateDays()" style="width: 100px; margin-bottom:0;">تعيين</button>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 10px;">
                    <button class="btn-secondary" onclick="renameProfile()">إعادة تسمية</button>
                    <button class="btn-danger" onclick="deleteProfile()">حذف</button>
                </div>
            </div>
        </div>

        <div class="card admin-only" id="createPanelView" style="display: none; text-align: right;">
            <h2 style="color: var(--primary); text-align: center;">إنشاء بروفايل جديد</h2>
            <input type="text" id="newProfileNameInput" placeholder="اسم البروفايل..." autocomplete="off">
            <input type="number" id="newProfileDaysInput" min="1" max="365" value="92">
            <button onclick="submitCreateProfile()">إنشاء</button>
            <button class="btn-secondary" onclick="activeTab = 'countdown'; render();" style="margin-top: 10px;">إلغاء</button>
        </div>

        <div class="card admin-only" id="settingsPanelView" style="display: none; text-align: right;">
            <h2 style="color: var(--primary); text-align: center;">إدارة المستخدمين</h2>
            <input type="text" id="newUsername" placeholder="يوزر جديد" autocomplete="off">
            <input type="password" id="newUserPass" placeholder="كلمة المرور">
            <select id="newUserRole">
                <option value="viewer">مُشاهد (قراءة فقط)</option>
                <option value="admin">مدير (تحكم كامل)</option>
            </select>
            <button onclick="createNewUser()">حفظ المستخدم</button>
            <div id="usersListContainer" style="max-height: 120px; overflow-y: auto; margin-top: 10px;"></div>
            <button class="btn-secondary" onclick="activeTab = 'countdown'; render();" style="margin-top: 10px;">العودة</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBraw98K7uLeQ5p7xmgn88x2jczO2EtzXM",
            authDomain: "jawharat-al-zaman-company.firebaseapp.com",
            databaseURL: "https://jawharat-al-zaman-company-default-rtdb.firebaseio.com",
            projectId: "jawharat-al-zaman-company",
            storageBucket: "jawharat-al-zaman-company.firebasestorage.app",
            messagingSenderId: "117069348206",
            appId: "1:117069348206:web:1d8e3c9c365557d02b557f",
            measurementId: "G-DPKEELR14J"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let accounts = { "admin": { pass: "1234", role: "admin", name: "المدير الأساسي" } };
        let currentUser = JSON.parse(localStorage.getItem('current_logged_user_v9')) || null;
        let data = { "الهدف الأساسي": { days: 92, maxDays: 92, date: new Date().toDateString() } };
        let current = "الهدف الأساسي";
        let activeTab = 'countdown';

        db.ref('app_data').on('value', (snapshot) => {
            let val = snapshot.val();
            if (val) {
                data = val;
                if (!data[current]) current = Object.keys(data)[0];
                render();
            } else { db.ref('app_data').set(data); }
        });

        db.ref('app_users').on('value', (snapshot) => {
            let val = snapshot.val();
            if (val) {
                accounts = val;
                if (!accounts["admin"]) { accounts["admin"] = { pass: "1234", role: "admin", name: "المدير الأساسي" }; db.ref('app_users').set(accounts); }
                renderUsersList();
            } else { db.ref('app_users').set(accounts); }
        });

        function handleLogin() {
            let u = document.getElementById('loginUser').value.trim();
            let p = document.getElementById('loginPass').value.trim();
            let err = document.getElementById('loginError');

            if (!u || !p) { err.textContent = 'أدخل اسم المستخدم وكلمة المرور'; return; }
            if (u === 'admin' && p === '1234') {
                currentUser = { username: 'admin', pass: '1234', role: 'admin', name: 'المدير الأساسي' };
                localStorage.setItem('current_logged_user_v9', JSON.stringify(currentUser));
                document.getElementById('loginOverlay').style.display = 'none';
                render(); return;
            }
            if (accounts[u] && String(accounts[u].pass) === String(p)) {
                currentUser = { username: u, ...accounts[u] };
                localStorage.setItem('current_logged_user_v9', JSON.stringify(currentUser));
                document.getElementById('loginOverlay').style.display = 'none';
                render();
            } else { err.textContent = 'خطأ في البيانات!'; }
        }

        function logout() {
            localStorage.removeItem('current_logged_user_v9');
            currentUser = null; location.reload();
        }

        function toggleView(tab) { activeTab = tab; render(); }

        function submitCreateProfile() {
            let name = document.getElementById('newProfileNameInput').value.trim();
            let days = parseInt(document.getElementById('newProfileDaysInput').value);
            if (!name || isNaN(days)) return alert('أدخل بيانات صحيحة');
            data[name] = { days: days, maxDays: days, date: new Date().toDateString() };
            current = name; db.ref('app_data').set(data); activeTab = 'countdown'; render();
        }

        function createNewUser() {
            let u = document.getElementById('newUsername').value.trim();
            let p = document.getElementById('newUserPass').value.trim();
            let role = document.getElementById('newUserRole').value;
            if (!u || !p) return alert('أدخل اليوزر والباسورد');
            accounts[u] = { pass: p, role: role, name: u };
            db.ref('app_users').set(accounts); alert('تم الحفظ');
        }

        function deleteUser(uname) {
            if (uname === 'admin') return;
            delete accounts[uname]; db.ref('app_users').set(accounts);
        }

        function renderUsersList() {
            let c = document.getElementById('usersListContainer');
            if (!c) return; c.innerHTML = '';
            for (let u in accounts) {
                c.innerHTML += `<div class="user-item"><span>${u}</span> ${u !== 'admin' ? `<button onclick="deleteUser('${u}')" style="width:auto; background:#ef4444; padding:2px 6px;">حذف</button>` : ''}</div>`;
            }
        }

        function updateDays() {
            let val = parseInt(document.getElementById('daysInput').value);
            if (isNaN(val)) return;
            data[current].days = val; data[current].maxDays = val;
            db.ref('app_data').set(data); render();
        }

        function renameProfile() {
            let newName = prompt("الاسم الجديد:", current);
            if (!newName || data[newName]) return;
            data[newName] = data[current]; delete data[current]; current = newName;
            db.ref('app_data').set(data); render();
        }

        function deleteProfile() {
            if (Object.keys(data).length <= 1) return alert('لا يمكن حذف الكل');
            delete data[current]; current = Object.keys(data)[0];
            db.ref('app_data').set(data); render();
        }

        function render() {
            if (!currentUser) { document.getElementById('loginOverlay').style.display = 'flex'; return; }
            document.getElementById('loginOverlay').style.display = 'none';
            
            let adminEls = document.querySelectorAll('.admin-only');
            adminEls.forEach(el => el.style.display = (currentUser.role === 'admin' ? (el.id === 'countdownCardView' ? 'block' : (activeTab === 'create' && el.id === 'createPanelView' ? 'block' : (activeTab === 'settings' && el.id === 'settingsPanelView' ? 'block' : 'none'))) : 'none'));
            if(currentUser.role === 'admin') {
                document.getElementById('adminBottomMenu').style.display = 'flex';
                document.getElementById('countdownCardView').style.display = (activeTab === 'countdown' ? 'block' : 'none');
            }

            let container = document.getElementById('listContainer');
            container.innerHTML = '';
            for (let name in data) {
                container.innerHTML += `<div class="profile-item ${name === current && activeTab === 'countdown' ? 'active' : ''}" onclick="current='${name}'; activeTab='countdown'; render();"><span>${name}</span><span>${data[name].days} يوم</span></div>`;
            }
            document.getElementById('activeTitle').textContent = current;
            document.getElementById('daysDisplay').textContent = data[current].days;
        }

        window.onload = () => { if (currentUser) render(); };
    </script>
</body>
</html>
