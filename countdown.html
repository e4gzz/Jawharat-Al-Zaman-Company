<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العداد التنازلي للبروفايلات</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --sidebar-bg: #111827;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main); color: var(--text-main);
            margin: 0; padding: 0; display: flex; height: 100vh; flex-direction: row; overflow: hidden;
            box-sizing: border-box;
        }
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.98); display: flex; justify-content: center; align-items: center; z-index: 9999;
            padding: 15px; box-sizing: border-box;
        }
        .login-card {
            background: var(--card-bg); padding: 30px 20px; border-radius: 20px;
            border: 1px solid var(--border-color); width: 100%; max-width: 380px; text-align: center;
        }
        .sidebar {
            width: 280px; background: var(--sidebar-bg); border-left: 1px solid var(--border-color);
            padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; flex-shrink: 0;
            overflow-y: auto;
        }
        .profiles-list { flex: 1; overflow-y: auto; margin-bottom: 10px; }
        .profile-item, .user-item, .menu-item {
            padding: 12px 14px; background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-color);
            border-radius: 10px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; transition: all 0.2s;
        }
        .profile-item:hover, .menu-item:hover { border-color: var(--primary); }
        .profile-item.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.2); }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 11px; color: white; }
        .bg-green { background-color: #10b981; }
        .bg-yellow { background-color: #f59e0b; color: #000; }
        .bg-red { background-color: #ef4444; }

        .main-container {
            flex: 1; display: flex; justify-content: center; align-items: center; padding: 15px;
            background: radial-gradient(circle at center, #131c31 0%, #0b0f19 100%); overflow-y: auto;
            box-sizing: border-box;
        }
        .card {
            background: var(--card-bg); padding: 25px 20px; border-radius: 20px;
            border: 1px solid var(--border-color); text-align: center; width: 100%; max-width: 480px;
            box-sizing: border-box;
        }
        .big-number { font-size: 60px; font-weight: 800; color: #10b981; margin: 10px 0; }
        input, select, button {
            width: 100%; padding: 12px 14px; margin-bottom: 10px;
            background: var(--bg-main); border: 1px solid var(--border-color); color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        button { background: var(--primary); border: none; cursor: pointer; font-weight: 600; }
        button:hover { background: #4f46e5; }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover { background: #475569; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .admin-only { display: none; }

        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; min-height: 100vh; overflow-y: auto; }
            .sidebar { width: 100%; max-height: 250px; border-left: none; border-bottom: 1px solid var(--border-color); order: 2; }
            .main-container { order: 1; min-height: 350px; }
            .big-number { font-size: 45px; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2 style="color: var(--primary); margin-top:0;">تسجيل الدخول</h2>
            <input type="text" id="loginUser" placeholder="اسم المستخدم" autocomplete="off">
            <input type="password" id="loginPass" placeholder="كلمة المرور">
            <button onclick="handleLogin()" style="margin-top: 5px;">دخول</button>
            <div id="loginError" style="color: #ef4444; font-size: 12px; margin-top: 10px;"></div>
        </div>
    </div>

    <div class="sidebar">
        <h3 style="color: var(--primary); text-align: center; margin-top:0;">البروفايلات</h3>
        <div class="profiles-list" id="listContainer"></div>
        <div id="adminBottomMenu" class="admin-only" style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: auto; display: flex; flex-direction: column; gap: 6px;">
            <div class="menu-item" onclick="toggleView('create')"><span>➕ إنشاء بروفايل جديد</span></div>
            <div class="menu-item" onclick="toggleView('settings')"><span>⚙️ الإعدادات والصلاحيات</span></div>
        </div>
        <button class="btn-secondary" onclick="logout()" style="margin-top: 8px; margin-bottom:0;">تسجيل خروج</button>
    </div>

    <div class="main-container">
        <div class="card" id="countdownCardView">
            <h2 id="activeTitle" style="color: var(--primary); margin-top:0;">جاري التحميل...</h2>
            <div style="color: var(--text-muted); font-size: 14px;">الأيام المتبقية</div>
            <div class="big-number" id="daysDisplay">0</div>
            <div id="userRoleIndicator"></div>

            <div id="adminSettingsSection" class="admin-only" style="margin-top: 15px; text-align: right; background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 10px;">
                <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">تعديل الأيام:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="daysInput" min="1" max="365" value="92" style="margin-bottom:0;">
                    <button onclick="updateDays()" style="width: 100px; margin-bottom:0;">تعيين</button>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 10px;">
                    <button class="btn-secondary" onclick="renameProfile()">إعادة تسمية</button>
                    <button class="btn-danger" onclick="deleteProfile()">حذف</button>
                </div>
            </div>
        </div>

        <div class="card admin-only" id="createPanelView" style="display: none; text-align: right;">
            <h2 style="color: var(--primary); text-align: center; margin-top:0;">إنشاء بروفايل جديد</h2>
            <input type="text" id="newProfileNameInput" placeholder="اسم البروفايل..." autocomplete="off">
            <input type="number" id="newProfileDaysInput" min="1" max="365" value="92">
            <button onclick="submitCreateProfile()">إنشاء وحفظ</button>
            <button class="btn-secondary" onclick="activeTab = 'countdown'; render();" style="margin-top: 5px;">إلغاء</button>
        </div>

        <div class="card admin-only" id="settingsPanelView" style="display: none; text-align: right;">
            <h2 style="color: var(--primary); text-align: center; margin-top:0;">إدارة المستخدمين</h2>
            <input type="text" id="newUsername" placeholder="يوزر جديد" autocomplete="off">
            <input type="password" id="newUserPass" placeholder="كلمة المرور">
            <select id="newUserRole">
                <option value="viewer">مُشاهد (قراءة فقط)</option>
                <option value="admin">مدير (تحكم كامل)</option>
            </select>
            <button onclick="createNewUser()">حفظ المستخدم</button>
            <div id="usersListContainer" style="max-height: 120px; overflow-y: auto; margin-top: 10px;"></div>
            <button class="btn-secondary" onclick="activeTab = 'countdown'; render();" style="margin-top: 10px;">العودة</button>
        </div>
    </div>

    <script>
        // قاعدة البيانات المحلية المستقرة تماماً والتي لا تنمسح عند الرفريش
        let accounts = JSON.parse(localStorage.getItem('app_users_v10')) || {
            "admin": { pass: "1234", role: "admin", name: "المدير الأساسي" }
        };

        let data = JSON.parse(localStorage.getItem('app_data_v10')) || {
            "الهدف الأساسي": { days: 92, maxDays: 92, date: new Date().toDateString() }
        };

        let currentUser = JSON.parse(localStorage.getItem('current_logged_user_v10')) || null;
        let current = Object.keys(data)[0] || "الهدف الأساسي";
        let activeTab = 'countdown';

        function saveData() {
            localStorage.setItem('app_data_v10', JSON.stringify(data));
        }

        function saveUsers() {
            localStorage.setItem('app_users_v10', JSON.stringify(accounts));
        }

        function getColorClass(d) {
            if (d > 20) return 'bg-green';
            if (d > 10) return 'bg-yellow';
            return 'bg-red';
        }

        function handleLogin() {
            let u = document.getElementById('loginUser').value.trim();
            let p = document.getElementById('loginPass').value.trim();
            let err = document.getElementById('loginError');

            if (!u || !p) { err.textContent = 'أدخل اسم المستخدم وكلمة المرور'; return; }
            
            if (accounts[u] && String(accounts[u].pass) === String(p)) {
                currentUser = { username: u, ...accounts[u] };
                localStorage.setItem('current_logged_user_v10', JSON.stringify(currentUser));
                err.textContent = '';
                render();
            } else {
                err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة!';
            }
        }

        function logout() {
            localStorage.removeItem('current_logged_user_v10');
            currentUser = null;
            render();
        }

        function toggleView(tab) { activeTab = tab; render(); }

        function submitCreateProfile() {
            let name = document.getElementById('newProfileNameInput').value.trim();
            let days = parseInt(document.getElementById('newProfileDaysInput').value);
            if (!name || isNaN(days)) return alert('أدخل بيانات صحيحة');
            if (data[name]) return alert('البروفايل موجود مسبقاً');
            
            data[name] = { days: days, maxDays: days, date: new Date().toDateString() };
            current = name;
            saveData();
            document.getElementById('newProfileNameInput').value = '';
            activeTab = 'countdown';
            render();
        }

        function createNewUser() {
            let u = document.getElementById('newUsername').value.trim();
            let p = document.getElementById('newUserPass').value.trim();
            let role = document.getElementById('newUserRole').value;
            
            if (!u || !p) return alert('أدخل اليوزر والباسورد');
            if (accounts[u]) return alert('المستخدم موجود مسبقاً!');

            accounts[u] = { pass: p, role: role, name: u };
            saveUsers();
            renderUsersList();
            document.getElementById('newUsername').value = '';
            document.getElementById('newUserPass').value = '';
            alert('تم حفظ المستخدم بنجاح!');
        }

        function deleteUser(uname) {
            if (uname === 'admin') return alert('لا يمكن حذف المدير الرئيسي');
            if (confirm(`حذف المستخدم ${uname}؟`)) {
                delete accounts[uname];
                saveUsers();
                renderUsersList();
            }
        }

        function renderUsersList() {
            let c = document.getElementById('usersListContainer');
            if (!c) return; 
            c.innerHTML = '';
            for (let u in accounts) {
                c.innerHTML += `<div class="user-item"><span><b>${u}</b> (${accounts[u].role})</span> ${u !== 'admin' ? `<button onclick="deleteUser('${u}')" style="width:auto; background:#ef4444; padding:2px 6px; margin:0;">حذف</button>` : '<span style="font-size:11px; color:var(--text-muted)">رئيسي</span>'}</div>`;
            }
        }

        function updateDays() {
            let val = parseInt(document.getElementById('daysInput').value);
            if (isNaN(val)) return;
            data[current].days = val;
            data[current].maxDays = val;
            saveData();
            render();
        }

        function renameProfile() {
            let newName = prompt("الاسم الجديد للبروفايل:", current);
            if (!newName || !newName.trim() || data[newName]) return alert('الاسم غير صالح أو موجود مسبقاً');
            newName = newName.trim();
            data[newName] = data[current];
            delete data[current];
            current = newName;
            saveData();
            render();
        }

        function deleteProfile() {
            if (Object.keys(data).length <= 1) return alert('لا يمكنك حذف البروفايل الوحيد');
            if (confirm(`حذف بروفايل ${current}؟`)) {
                delete data[current];
                current = Object.keys(data)[0];
                saveData();
                render();
            }
        }

        function render() {
            let overlay = document.getElementById('loginOverlay');
            if (!currentUser || !accounts[currentUser.username]) {
                overlay.style.display = 'flex';
                return;
            }
            overlay.style.display = 'none';
            
            let adminEls = document.querySelectorAll('.admin-only');
            adminEls.forEach(el => {
                if (currentUser.role === 'admin') {
                    if (el.id === 'countdownCardView') el.style.display = (activeTab === 'countdown' ? 'block' : 'none');
                    else if (el.id === 'createPanelView') el.style.display = (activeTab === 'create' ? 'block' : 'none');
                    else if (el.id === 'settingsPanelView') el.style.display = (activeTab === 'settings' ? 'block' : 'none');
                } else {
                    el.style.display = (el.id === 'countdownCardView' ? 'block' : 'none');
                }
            });

            if (currentUser.role === 'admin') {
                document.getElementById('adminBottomMenu').style.display = 'flex';
                renderUsersList();
            }

            let container = document.getElementById('listContainer');
            container.innerHTML = '';
            for (let name in data) {
                let badgeColor = getColorClass(data[name].days);
                container.innerHTML += `
                    <div class="profile-item ${name === current && activeTab === 'countdown' ? 'active' : ''}" onclick="current='${name}'; activeTab='countdown'; render();">
                        <span style="font-weight: 500;">${name}</span>
                        <span class="badge ${badgeColor}">${data[name].days} يوم</span>
                    </div>`;
            }
            if (data[current]) {
                document.getElementById('activeTitle').textContent = current;
                document.getElementById('daysDisplay').textContent = data[current].days;
                let daysInput = document.getElementById('daysInput');
                if (daysInput) daysInput.value = data[current].maxDays || data[current].days;
            }
        }

        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
