<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العداد التنازلي للاشتراكات</title>
<style>
:root{color-scheme:dark;--bg:#0b0f19;--glass:rgba(30,41,59,.65);--gbd:rgba(148,163,184,.18);--bd:rgba(148,163,184,.25);--pr:#6366f1;--pr2:#8b5cf6;--prl:#a5b4fc;--mut:#94a3b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#0b0f19;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#f8fafc;margin:0;display:flex;height:100vh;overflow:hidden;box-sizing:border-box;background:radial-gradient(circle at 15% 15%,rgba(99,102,241,.35),transparent 45%),radial-gradient(circle at 85% 85%,rgba(16,185,129,.22),transparent 45%),#0b0f19;background-repeat:no-repeat}

/* ===== صفحة الدخول ===== */
#login{position:fixed;inset:0;z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px;box-sizing:border-box;overflow-y:auto;background:radial-gradient(circle at 15% 15%,rgba(99,102,241,.35),transparent 45%),radial-gradient(circle at 85% 85%,rgba(16,185,129,.22),transparent 45%),#0b0f19}
.lcard{width:100%;max-width:400px;padding:36px 28px 28px;box-sizing:border-box;border-radius:24px;text-align:center;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gbd);box-shadow:0 25px 60px rgba(0,0,0,.45);animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.logo{width:68px;height:68px;margin:0 auto 18px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 10px 30px rgba(99,102,241,.45)}
.lcard h2{margin:0 0 6px;font-size:24px}.sub{color:var(--mut);font-size:14px;margin-bottom:26px}
.field{position:relative;margin-bottom:14px;text-align:right}
.ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut);pointer-events:none}
.field input{margin:0;padding:14px 44px}
.eye,.eye:hover{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px 8px;background:none;box-shadow:none;font-size:16px;line-height:1}
.lbtn{margin:8px 0 0;padding:14px;font-size:15px}
#err{min-height:20px;margin-top:14px;font-size:13px;color:#f87171}

/* ===== الداخل ===== */
.sidebar{width:280px;background:rgba(17,24,39,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid var(--gbd);padding:20px;display:flex;flex-direction:column;box-sizing:border-box;flex-shrink:0;overflow-y:auto}
.plist{flex:1;overflow-y:auto;margin-bottom:10px}
.item{padding:12px 14px;background:rgba(15,23,42,.45);border:1px solid var(--gbd);border-radius:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;transition:all .2s}
.item:hover{border-color:var(--pr);background:rgba(99,102,241,.1)}
.item.active{border-color:var(--pr);background:rgba(99,102,241,.22);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.badge{padding:4px 8px;border-radius:6px;font-weight:600;font-size:11px;color:#fff}
.g{background:#10b981}.y{background:#f59e0b;color:#000}.r{background:#ef4444}
.main{flex:1;display:flex;justify-content:center;align-items:center;padding:15px;overflow-y:auto;box-sizing:border-box}
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:28px 22px;border-radius:24px;border:1px solid var(--gbd);box-shadow:0 25px 60px rgba(0,0,0,.45);text-align:center;width:100%;max-width:480px;box-sizing:border-box;animation:in .5s ease both}
.big{font-size:60px;font-weight:800;color:#10b981;margin:10px 0;text-shadow:0 0 30px rgba(16,185,129,.35)}
.note-view{display:none;margin-top:14px;text-align:right;background:rgba(11,15,25,.45);border:1px solid var(--gbd);padding:12px 14px;border-radius:16px}
.note-label{font-size:12px;color:var(--mut);margin-bottom:6px}
.note-text{font-size:14px;line-height:1.7;color:#e2e8f0;white-space:pre-wrap;word-break:break-word}
.admin-box{display:none;margin-top:18px;text-align:right;background:rgba(11,15,25,.45);border:1px solid var(--gbd);padding:14px;border-radius:16px}
input,select,button,textarea{width:100%;padding:12px 14px;margin-bottom:10px;background:rgba(11,15,25,.7);border:1px solid var(--bd);color:#fff;border-radius:12px;box-sizing:border-box;font-size:14px;font-family:inherit;transition:border-color .2s,box-shadow .2s,transform .15s}
textarea{min-height:80px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px rgba(99,102,241,.25)}
option{background:#0b0f19}
button{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;cursor:pointer;font-weight:600;box-shadow:0 8px 22px rgba(99,102,241,.35)}
button:hover{background:linear-gradient(135deg,#4f46e5,#7c3aed);transform:translateY(-1px);box-shadow:0 12px 28px rgba(99,102,241,.45)}
button:active{transform:none}
.sec{background:rgba(51,65,85,.75);box-shadow:none}.sec:hover{background:rgba(71,85,105,.85);box-shadow:none}
.dng{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 8px 22px rgba(239,68,68,.3)}.dng:hover{background:linear-gradient(135deg,#dc2626,#b91c1c);box-shadow:0 12px 28px rgba(239,68,68,.4)}
@media(max-width:768px){
body{flex-direction:column;height:auto;min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-y:auto}
.main{order:1;flex:none;padding:12px;align-items:flex-start;overflow:visible}
.sidebar{order:2;flex:none;width:100%;overflow-y:visible;padding:15px;border-left:none;border-top:1px solid var(--gbd)}
.plist{flex:none;max-height:220px}.card{padding:22px 16px}.big{font-size:45px}
input,select,button,textarea{font-size:16px}.lcard{padding:30px 20px 22px}}
</style>
</head>
<body>

<div id="login"><div class="lcard">
<div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
<h2>مرحباً بك</h2><div class="sub">سجّل دخولك لمتابعة الاشتراكات</div>
<div class="field"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><input type="text" id="lu" placeholder="اسم المستخدم" autocomplete="username"></div>
<div class="field"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input type="password" id="lp" placeholder="كلمة المرور" autocomplete="current-password"><button type="button" class="eye" data-act="eye" aria-label="إظهار كلمة المرور">👁️</button></div>
<button class="lbtn" data-act="login">دخول</button>
<div id="err"></div>
</div></div>

<div class="sidebar">
<h3 style="color:var(--prl);text-align:center;margin-top:0">الاشتراكات</h3>
<div class="plist" id="list"></div>
<div id="adminMenu" style="display:none;border-top:1px solid var(--gbd);padding-top:10px;margin-top:auto;flex-direction:column;gap:6px">
<div class="item" data-act="view" data-tab="create"><span>➕ إنشاء اشتراك جديد</span></div>
<div class="item" data-act="view" data-tab="settings"><span>⚙️ الإعدادات والصلاحيات</span></div>
</div>
<button class="sec" data-act="logout" style="margin-top:8px;margin-bottom:0">تسجيل خروج</button>
</div>

<div class="main">
<div class="card" id="vCount">
<h2 id="title" style="color:var(--prl);margin-top:0">جاري التحميل...</h2>
<div style="color:var(--mut);font-size:14px">الأيام المتبقية</div>
<div class="big" id="days">0</div>

<div class="note-view" id="noteView">
<div class="note-label">📝 ملاحظات</div>
<div class="note-text" id="noteText"></div>
</div>

<div id="adminBox" class="admin-box">
<label style="font-size:12px;color:var(--mut);display:block;margin-bottom:6px">تعديل الأيام:</label>
<div style="display:flex;gap:8px"><input type="number" id="dIn" min="1" max="365" style="margin-bottom:0"><button data-act="setDays" style="width:100px;margin-bottom:0">تعيين</button></div>
<label style="font-size:12px;color:var(--mut);display:block;margin:12px 0 6px">الملاحظات:</label>
<textarea id="noteIn" placeholder="اكتب ملاحظاتك هنا..."></textarea>
<button class="sec" data-act="saveNote">حفظ الملاحظات</button>
<div style="display:flex;gap:8px"><button class="sec" data-act="rename" style="margin-bottom:0">إعادة تسمية</button><button class="dng" data-act="delP" style="margin-bottom:0">حذف</button></div>
</div>
</div>

<div class="card" id="vCreate" style="display:none;text-align:right">
<h2 style="color:var(--prl);text-align:center;margin-top:0">إنشاء اشتراك جديد</h2>
<input type="text" id="nName" placeholder="اسم الاشتراك..." autocomplete="off">
<input type="number" id="nDays" min="1" max="365" value="92">
<textarea id="nNote" placeholder="ملاحظات (اختياري)..."></textarea>
<button data-act="create">إنشاء وحفظ</button>
<button class="sec" data-act="view" data-tab="countdown">إلغاء</button>
</div>

<div class="card" id="vSettings" style="display:none;text-align:right">
<h2 style="color:var(--prl);text-align:center;margin-top:0">إدارة المستخدمين</h2>
<input type="text" id="nUser" placeholder="يوزر جديد" autocomplete="off">
<input type="password" id="nPass" placeholder="كلمة المرور" autocomplete="new-password">
<select id="nRole"><option value="viewer">مُشاهد (قراءة فقط)</option><option value="admin">مدير (تحكم كامل)</option></select>
<button data-act="addUser">حفظ المستخدم</button>
<div id="ulist" style="max-height:120px;overflow-y:auto;margin-top:10px"></div>
<button class="sec" data-act="view" data-tab="countdown" style="margin-top:10px">العودة</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBraw98K7uLeQ5p7xmgn88x2jczO2EtzXM",
  authDomain: "jawharat-al-zaman-company.firebaseapp.com",
  projectId: "jawharat-al-zaman-company",
  storageBucket: "jawharat-al-zaman-company.firebasestorage.app",
  messagingSenderId: "117069348206",
  appId: "1:117069348206:web:1d8e3c9c365557d02b557f"
};

const db = getFirestore(initializeApp(firebaseConfig));
const usersRef = doc(db, 'app', 'users');
const profilesRef = doc(db, 'app', 'profiles');

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== العد التنازلي: ينقص يوم عند 12 بالليل =====
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dn = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
const left = p => Math.max(0, (p.maxDays ?? p.days) - Math.max(0, dn(today()) - dn(p.start || today())));
const cls = d => d > 20 ? 'g' : d > 10 ? 'y' : 'r';

const loadedAt = new Date();
const loadTime = pad(loadedAt.getHours()) + ':' + pad(loadedAt.getMinutes());

let accounts = null, data = null, user = null, current = null, tab = 'countdown';
try { user = JSON.parse(localStorage.getItem('current_logged_user_v11'))?.username || null; } catch (e) {}

const saveData = () => setDoc(profilesRef, { data }).catch(showError);
const saveUsers = () => setDoc(usersRef, { accounts }).catch(showError);
function showError(e) { console.error(e); $('err').textContent = 'خطأ بالاتصال بقاعدة البيانات: ' + (e.code || e.message); }

onSnapshot(usersRef, snap => {
  if (snap.exists()) accounts = snap.data().accounts;
  else { accounts = { admin: { pass: '1234', role: 'admin', name: 'المدير الأساسي' } }; saveUsers(); }
  render();
}, showError);

onSnapshot(profilesRef, snap => {
  if (snap.exists()) data = snap.data().data;
  else { data = { 'الهدف الأساسي': { days: 92, maxDays: 92, start: today(), note: '' } }; saveData(); }
  let changed = false;
  for (const n in data) if (!data[n].start) { data[n].start = today(); changed = true; }
  if (changed) saveData();
  if (!current || !data[current]) current = Object.keys(data)[0];
  render();
}, showError);

// تحديث الرقم تلقائياً لو تغيّر اليوم والصفحة مفتوحة
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 30000);

function login() {
  const u = $('lu').value.trim(), p = $('lp').value.trim();
  if (!accounts) { $('err').textContent = 'جاري الاتصال بقاعدة البيانات، حاول بعد ثواني...'; return; }
  if (!u || !p) { $('err').textContent = 'أدخل اسم المستخدم وكلمة المرور'; return; }
  if (accounts[u] && String(accounts[u].pass) === p) {
    user = u;
    localStorage.setItem('current_logged_user_v11', JSON.stringify({ username: u }));
    $('err').textContent = ''; $('lp').value = '';
    render();
  } else $('err').textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة!';
}

function render() {
  if (!accounts || !data) return;
  if (!user || !accounts[user]) { $('login').style.display = 'flex'; return; }
  $('login').style.display = 'none';
  const adm = accounts[user].role === 'admin';
  if (!adm) tab = 'countdown';
  $('vCount').style.display = tab === 'countdown' ? 'block' : 'none';
  $('vCreate').style.display = adm && tab === 'create' ? 'block' : 'none';
  $('vSettings').style.display = adm && tab === 'settings' ? 'block' : 'none';
  $('adminBox').style.display = adm ? 'block' : 'none';
  $('adminMenu').style.display = adm ? 'flex' : 'none';

  if (adm) $('ulist').innerHTML = Object.keys(accounts).map(u =>
    `<div class="item"><span><b>${esc(u)}</b> (${esc(accounts[u].role)})</span>` +
    (u !== 'admin'
      ? `<button class="dng" data-act="delUser" data-name="${esc(u)}" style="width:auto;padding:2px 8px;margin:0">حذف</button>`
      : '<span style="font-size:11px;color:var(--mut)">رئيسي</span>') + '</div>').join('');

  $('list').innerHTML = Object.keys(data).map(n => {
    const l = left(data[n]);
    return `<div class="item ${n === current && tab === 'countdown' ? 'active' : ''}" data-act="sel" data-name="${esc(n)}"><span style="font-weight:500">${esc(n)}</span><span class="badge ${cls(l)}">${l} يوم</span></div>`;
  }).join('');

  const now = new Date();
  $('title').innerHTML = `${now.toLocaleDateString('ar-IQ', { weekday: 'long' })} ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}<div style="font-size:13px;color:var(--mut);font-weight:400;margin-top:4px">آخر تحديث للصفحة: ${loadTime}</div>`;

  const p = data[current];
  if (p) {
    $('days').textContent = left(p);
    // الملاحظات تظهر داخل البطاقة الرئيسية تحت الأيام المتبقية
    const note = (p.note || '').trim();
    $('noteText').textContent = note;
    $('noteView').style.display = note ? 'block' : 'none';
    if (document.activeElement !== $('dIn')) $('dIn').value = p.maxDays ?? p.days;
    if (document.activeElement !== $('noteIn')) $('noteIn').value = p.note || '';
  }
}

const act = {
  login,
  eye(el) { const i = $('lp'); i.type = i.type === 'password' ? 'text' : 'password'; el.textContent = i.type === 'password' ? '👁️' : '🙈'; },
  logout() { localStorage.removeItem('current_logged_user_v11'); user = null; tab = 'countdown'; render(); },
  view(el) { tab = el.dataset.tab; render(); },
  sel(el) { current = el.dataset.name; tab = 'countdown'; render(); },
  setDays() {
    const v = parseInt($('dIn').value); if (isNaN(v)) return;
    data[current] = { ...data[current], days: v, maxDays: v, start: today() };
    saveData(); render();
  },
  saveNote(el) {
    data[current].note = $('noteIn').value.trim();
    saveData(); render();
    el.textContent = 'تم الحفظ ✓';
    setTimeout(() => { el.textContent = 'حفظ الملاحظات'; }, 1500);
  },
  rename() {
    let n = prompt('الاسم الجديد للاشتراك:', current);
    if (!n || !n.trim()) return; n = n.trim();
    if (data[n]) return alert('الاسم موجود مسبقاً');
    data[n] = data[current]; delete data[current]; current = n;
    saveData(); render();
  },
  delP() {
    if (Object.keys(data).length <= 1) return alert('لا يمكنك حذف الاشتراك الوحيد');
    if (confirm(`حذف اشتراك ${current}؟`)) { delete data[current]; current = Object.keys(data)[0]; saveData(); render(); }
  },
  create() {
    const n = $('nName').value.trim(), d = parseInt($('nDays').value);
    if (!n || isNaN(d)) return alert('أدخل بيانات صحيحة');
    if (data[n]) return alert('الاشتراك موجود مسبقاً');
    data[n] = { days: d, maxDays: d, start: today(), note: $('nNote').value.trim() };
    current = n; $('nName').value = ''; $('nNote').value = ''; tab = 'countdown';
    saveData(); render();
  },
  addUser() {
    const u = $('nUser').value.trim(), p = $('nPass').value.trim();
    if (!u || !p) return alert('أدخل اليوزر والباسورد');
    if (accounts[u]) return alert('المستخدم موجود مسبقاً!');
    accounts[u] = { pass: p, role: $('nRole').value, name: u };
    $('nUser').value = ''; $('nPass').value = '';
    saveUsers(); alert('تم حفظ المستخدم بنجاح!'); render();
  },
  delUser(el) {
    const u = el.dataset.name;
    if (u === 'admin') return alert('لا يمكن حذف المدير الرئيسي');
    if (confirm(`حذف المستخدم ${u}؟`)) { delete accounts[u]; saveUsers(); render(); }
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && act[el.dataset.act]) act[el.dataset.act](el);
});
['lu', 'lp'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') login(); }));
</script>
</body>
</html>
