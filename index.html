<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العداد التنازلي للاشتراكات</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --sidebar-bg: #111827;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main); color: var(--text-main);
            margin: 0; padding: 0; display: flex; height: 100vh; flex-direction: row; overflow: hidden;
            box-sizing: border-box;
        }

        /* ===== صفحة تسجيل الدخول ===== */
        #loginOverlay {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; overflow-y: auto;
            background:
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.35), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.22), transparent 45%),
                #0b0f19;
        }
        .login-card {
            width: 100%; max-width: 400px; padding: 36px 28px 28px; box-sizing: border-box;
            border-radius: 24px; text-align: center;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            animation: loginIn 0.5s ease both;
        }
        @keyframes loginIn {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to { opacity: 1; transform: none; }
        }
        .login-logo {
            width: 68px; height: 68px; margin: 0 auto 18px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.45);
        }
        .login-card h2 { margin: 0 0 6px; font-size: 24px; font-weight: 700; }
        .login-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 26px; }
        .field { position: relative; margin-bottom: 14px; text-align: right; }
        .field .ico {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px; color: var(--text-muted); pointer-events: none;
        }
        .field input {
            margin: 0; padding: 14px 44px; border-radius: 12px;
            background: rgba(11, 15, 25, 0.7);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
        .toggle-pass, .toggle-pass:hover {
            position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
            width: auto; margin: 0; padding: 6px 8px; background: none; font-size: 16px; line-height: 1;
        }
        .login-btn {
            margin: 8px 0 0; padding: 14px; border-radius: 12px; font-size: 15px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 8px 22px rgba(99, 102, 241, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            transform: translateY(-1px); box-shadow: 0 12px 28px rgba(99, 102, 241, 0.5);
        }
        .login-btn:active { transform: translateY(0); }
        #loginError { min-height: 20px; margin-top: 14px; font-size: 13px; color: #f87171; }

        /* ===== باقي الموقع ===== */
        .sidebar {
            width: 280px; background: var(--sidebar-bg); border-left: 1px solid var(--border-color);
            padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; flex-shrink: 0;
            overflow-y: auto;
        }
        .profiles-list { flex: 1; overflow-y: auto; margin-bottom: 10px; }
        .profile-item, .user-item, .menu-item {
            padding: 12px 14px; background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-color);
            border-radius: 10px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; transition: all 0.2s;
        }
        .profile-item:hover, .menu-item:hover { border-color: var(--primary); }
        .profile-item.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.2); }

        .badge { padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 11px; color: white; }
        .bg-green { background-color: #10b981; }
        .bg-yellow { background-color: #f59e0b; color: #000; }
        .bg-red { background-color: #ef4444; }

        .main-container {
            flex: 1; display: flex; justify-content: center; align-items: center; padding: 15px;
            background: radial-gradient(circle at center, #131c31 0%, #0b0f19 100%); overflow-y: auto;
            box-sizing: border-box;
        }
        .card {
            background: var(--card-bg); padding: 25px 20px; border-radius: 20px;
            border: 1px solid var(--border-color); text-align: center; width: 100%; max-width: 480px;
            box-sizing: border-box;
        }
        .big-number { font-size: 60px; font-weight: 800; color: #10b981; margin: 10px 0; }
        input, select, button {
            width: 100%; padding: 12px 14px; margin-bottom: 10px;
            background: var(--bg-main); border: 1px solid var(--border-color); color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        button { background: var(--primary); border: none; cursor: pointer; font-weight: 600; }
        button:hover { background: #4f46e5; }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover { background: #475569; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .admin-only { display: none; }

        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; overflow-y: auto; }
            .main-container { order: 1; flex: none; min-height: 0; padding: 12px; align-items: flex-start; overflow: visible; }
            .sidebar { order: 2; flex: none; width: 100%; max-height: none; overflow-y: visible; padding: 15px; border-left: none; border-top: 1px solid var(--border-color); }
            .profiles-list { flex: none; max-height: 220px; }
            .card { padding: 20px 15px; }
            .big-number { font-size: 45px; }
            input, select, button { font-size: 16px; }
            .login-card { padding: 30px 20px 22px; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <div class="login-logo">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </div>
            <h2>مرحباً بك</h2>
            <div class="login-sub">سجّل دخولك لمتابعة الاشتراكات</div>

            <div class="field">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                <input type="text" id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
            </div>
            <div class="field">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                <input type="password" id="loginPass" placeholder="كلمة المرور" autocomplete="current-password">
                <button type="button" class="toggle-pass" data-act="togglePass" aria-label="إظهار كلمة المرور">👁️</button>
            </div>

            <button class="login-btn" data-act="login">دخول</button>
            <div id="loginError"></div>
        </div>
    </div>

    <div class="sidebar">
        <h3 style="color: var(--primary); text-align: center; margin-top:0;">الاشتراكات</h3>
        <div class="profiles-list" id="listContainer"></div>
        <div id="adminBottomMenu" class="admin-only" style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: auto; flex-direction: column; gap: 6px;">
            <div class="menu-item" data-act="view" data-tab="create"><span>➕ إنشاء اشتراك جديد</span></div>
            <div class="menu-item" data-act="view" data-tab="settings"><span>⚙️ الإعدادات والصلاحيات</span></div>
        </div>
        <button class="btn-secondary" data-act="logout" style="margin-top: 8px; margin-bottom:0;">تسجيل خروج</button>
    </div>

    <div class="main-container">
        <div class="card" id="countdownCardView">
            <h2 id="activeTitle" style="color: var(--primary); margin-top:0;">جاري التحميل...</h2>
            <div style="color: var(--text-muted); font-size: 14px;">الأيام المتبقية</div>
            <div class="big-number" id="daysDisplay">0</div>

            <div id="adminSettingsSection" class="admin-only" style="margin-top: 15px; text-align: right; background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 10px;">
                <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">تعديل الأيام:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="daysInput" min="1" max="365" value="92" style="margin-bottom:0;">
                    <button data-act="setDays" style="width: 100px; margin-bottom:0;">تعيين</button>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 10px;">
                    <button class="btn-secondary" data-act="rename">إعادة تسمية</button>
                    <button class="btn-danger" data-act="deleteProfile">حذف</button>
                </div>
            </div>
        </div>

        <div class="card admin-only" id="createPanelView" style="text-align: right;">
            <h2 style="color: var(--primary); text-align: center; margin-top:0;">إنشاء اشتراك جديد</h2>
            <input type="text" id="newProfileNameInput" placeholder="اسم الاشتراك..." autocomplete="off">
            <input type="number" id="newProfileDaysInput" min="1" max="365" value="92">
            <button data-act="createProfile">إنشاء وحفظ</button>
            <button class="btn-secondary" data-act="view" data-tab="countdown" style="margin-top: 5px;">إلغاء</button>
        </div>

        <div class="card admin-only" id="settingsPanelView" style="text-align: right;">
            <h2 style="color: var(--primary); text-align: center; margin-top:0;">إدارة المستخدمين</h2>
            <input type="text" id="newUsername" placeholder="يوزر جديد" autocomplete="off">
            <input type="password" id="newUserPass" placeholder="كلمة المرور">
            <select id="newUserRole">
                <option value="viewer">مُشاهد (قراءة فقط)</option>
                <option value="admin">مدير (تحكم كامل)</option>
            </select>
            <button data-act="createUser">حفظ المستخدم</button>
            <div id="usersListContainer" style="max-height: 120px; overflow-y: auto; margin-top: 10px;"></div>
            <button class="btn-secondary" data-act="view" data-tab="countdown" style="margin-top: 10px;">العودة</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBraw98K7uLeQ5p7xmgn88x2jczO2EtzXM",
            authDomain: "jawharat-al-zaman-company.firebaseapp.com",
            projectId: "jawharat-al-zaman-company",
            storageBucket: "jawharat-al-zaman-company.firebasestorage.app",
            messagingSenderId: "117069348206",
            appId: "1:117069348206:web:1d8e3c9c365557d02b557f"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const usersRef = doc(db, 'app', 'users');
        const profilesRef = doc(db, 'app', 'profiles');

        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // ===== التاريخ والعد التنازلي (ينقص يوم عند 12 بالليل) =====
        const pad = n => String(n).padStart(2, '0');
        const todayKey = () => {
            const d = new Date();
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        };
        const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
        const remaining = p => {
            const total = p.maxDays ?? p.days;
            const passed = Math.max(0, dayNum(todayKey()) - dayNum(p.start || todayKey()));
            return Math.max(0, total - passed);
        };

        // وقت آخر تحديث للصفحة (وقت فتحها أو عمل Refresh)
        const loadedAt = new Date();
        const loadTime = `${pad(loadedAt.getHours())}:${pad(loadedAt.getMinutes())}`;

        let accounts = null;
        let data = null;
        let currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('current_logged_user_v11')); } catch (e) {}
        let current = null;
        let activeTab = 'countdown';

        const saveData = () => setDoc(profilesRef, { data }).catch(showError);
        const saveUsers = () => setDoc(usersRef, { accounts }).catch(showError);

        function showError(err) {
            console.error(err);
            $('loginError').textContent = 'خطأ بالاتصال بقاعدة البيانات: ' + (err.code || err.message);
        }

        onSnapshot(usersRef, snap => {
            if (snap.exists()) accounts = snap.data().accounts;
            else { accounts = { admin: { pass: "1234", role: "admin", name: "المدير الأساسي" } }; saveUsers(); }
            render();
        }, showError);

        onSnapshot(profilesRef, snap => {
            if (snap.exists()) data = snap.data().data;
            else { data = { "الهدف الأساسي": { days: 92, maxDays: 92, start: todayKey() } }; saveData(); }
            let changed = false;
            for (const n in data) if (!data[n].start) { data[n].start = todayKey(); changed = true; }
            if (changed) saveData();
            if (!current || !data[current]) current = Object.keys(data)[0];
            render();
        }, showError);

        // إذا تغيّر اليوم والصفحة مفتوحة، يتحدث الرقم تلقائياً
        let lastDay = todayKey();
        setInterval(() => {
            if (todayKey() !== lastDay) { lastDay = todayKey(); render(); }
        }, 30000);

        function getColorClass(d) {
            if (d > 20) return 'bg-green';
            if (d > 10) return 'bg-yellow';
            return 'bg-red';
        }

        function handleLogin() {
            const u = $('loginUser').value.trim();
            const p = $('loginPass').value.trim();
            const err = $('loginError');
            if (!accounts) { err.textContent = 'جاري الاتصال بقاعدة البيانات، حاول بعد ثواني...'; return; }
            if (!u || !p) { err.textContent = 'أدخل اسم المستخدم وكلمة المرور'; return; }
            if (accounts[u] && String(accounts[u].pass) === String(p)) {
                currentUser = { username: u };
                localStorage.setItem('current_logged_user_v11', JSON.stringify(currentUser));
                err.textContent = '';
                $('loginPass').value = '';
                render();
            } else {
                err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة!';
            }
        }

        function logout() {
            localStorage.removeItem('current_logged_user_v11');
            currentUser = null;
            activeTab = 'countdown';
            render();
        }

        function createProfile() {
            const name = $('newProfileNameInput').value.trim();
            const days = parseInt($('newProfileDaysInput').value);
            if (!name || isNaN(days)) return alert('أدخل بيانات صحيحة');
            if (data[name]) return alert('الاشتراك موجود مسبقاً');
            data[name] = { days, maxDays: days, start: todayKey() };
            current = name;
            saveData();
            $('newProfileNameInput').value = '';
            activeTab = 'countdown';
            render();
        }

        function createUser() {
            const u = $('newUsername').value.trim();
            const p = $('newUserPass').value.trim();
            const role = $('newUserRole').value;
            if (!u || !p) return alert('أدخل اليوزر والباسورد');
            if (accounts[u]) return alert('المستخدم موجود مسبقاً!');
            accounts[u] = { pass: p, role, name: u };
            saveUsers();
            $('newUsername').value = '';
            $('newUserPass').value = '';
            alert('تم حفظ المستخدم بنجاح!');
            render();
        }

        function deleteUser(uname) {
            if (uname === 'admin') return alert('لا يمكن حذف المدير الرئيسي');
            if (confirm(`حذف المستخدم ${uname}؟`)) {
                delete accounts[uname];
                saveUsers();
                render();
            }
        }

        function setDays() {
            const val = parseInt($('daysInput').value);
            if (isNaN(val)) return;
            data[current].days = val;
            data[current].maxDays = val;
            data[current].start = todayKey();
            saveData();
            render();
        }

        function renameProfile() {
            let newName = prompt("الاسم الجديد للاشتراك:", current);
            if (!newName || !newName.trim()) return;
            newName = newName.trim();
            if (data[newName]) return alert('الاسم موجود مسبقاً');
            data[newName] = data[current];
            delete data[current];
            current = newName;
            saveData();
            render();
        }

        function deleteProfile() {
            if (Object.keys(data).length <= 1) return alert('لا يمكنك حذف الاشتراك الوحيد');
            if (confirm(`حذف اشتراك ${current}؟`)) {
                delete data[current];
                current = Object.keys(data)[0];
                saveData();
                render();
            }
        }

        function render() {
            if (!accounts || !data) return;
            const overlay = $('loginOverlay');
            if (!currentUser || !accounts[currentUser.username]) {
                overlay.style.display = 'flex';
                return;
            }
            overlay.style.display = 'none';

            const isAdmin = accounts[currentUser.username].role === 'admin';
            if (!isAdmin) activeTab = 'countdown';

            $('countdownCardView').style.display = activeTab === 'countdown' ? 'block' : 'none';
            $('createPanelView').style.display = isAdmin && activeTab === 'create' ? 'block' : 'none';
            $('settingsPanelView').style.display = isAdmin && activeTab === 'settings' ? 'block' : 'none';
            $('adminSettingsSection').style.display = isAdmin ? 'block' : 'none';
            $('adminBottomMenu').style.display = isAdmin ? 'flex' : 'none';

            if (isAdmin) {
                $('usersListContainer').innerHTML = Object.keys(accounts).map(u =>
                    `<div class="user-item"><span><b>${esc(u)}</b> (${esc(accounts[u].role)})</span> ` +
                    (u !== 'admin'
                        ? `<button data-act="deleteUser" data-name="${esc(u)}" style="width:auto; background:#ef4444; padding:2px 6px; margin:0;">حذف</button>`
                        : '<span style="font-size:11px; color:var(--text-muted)">رئيسي</span>') +
                    `</div>`).join('');
            }

            $('listContainer').innerHTML = Object.keys(data).map(name => {
                const left = remaining(data[name]);
                return `<div class="profile-item ${name === current && activeTab === 'countdown' ? 'active' : ''}" data-act="select" data-name="${esc(name)}">
                    <span style="font-weight: 500;">${esc(name)}</span>
                    <span class="badge ${getColorClass(left)}">${left} يوم</span>
                </div>`;
            }).join('');

            if (data[current]) {
                const now = new Date();
                const dayName = now.toLocaleDateString('ar-IQ', { weekday: 'long' });
                const dateStr = `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`;
                $('activeTitle').innerHTML =
                    `${dayName} ${dateStr}` +
                    `<div style="font-size:13px; color:var(--text-muted); font-weight:400; margin-top:4px;">آخر تحديث للصفحة: ${loadTime}</div>`;
                $('daysDisplay').textContent = remaining(data[current]);
                $('daysInput').value = data[current].maxDays ?? data[current].days;
            }
        }

        // زر Enter يسجّل الدخول
        ['loginUser', 'loginPass'].forEach(id =>
            $(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); })
        );

        document.addEventListener('click', e => {
            const el = e.target.closest('[data-act]');
            if (!el) return;
            const name = el.dataset.name;
            switch (el.dataset.act) {
                case 'login': handleLogin(); break;
                case 'togglePass': {
                    const i = $('loginPass');
                    i.type = i.type === 'password' ? 'text' : 'password';
                    el.textContent = i.type === 'password' ? '👁️' : '🙈';
                    break;
                }
                case 'logout': logout(); break;
                case 'view': activeTab = el.dataset.tab; render(); break;
                case 'select': current = name; activeTab = 'countdown'; render(); break;
                case 'setDays': setDays(); break;
                case 'rename': renameProfile(); break;
                case 'deleteProfile': deleteProfile(); break;
                case 'createProfile': createProfile(); break;
                case 'createUser': createUser(); break;
                case 'deleteUser': deleteUser(name); break;
            }
        });
    </script>
</body>
</html>
