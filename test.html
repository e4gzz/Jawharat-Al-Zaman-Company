<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الاشتراكات والصرفيات (تجريبي)</title>
<style>
:root{color-scheme:dark;--bg:#0b0f19;--glass:rgba(30,41,59,.65);--gbd:rgba(148,163,184,.18);--bd:rgba(148,163,184,.25);--pr:#6366f1;--pr2:#8b5cf6;--prl:#a5b4fc;--mut:#94a3b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#0b0f19;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#f8fafc;margin:0;display:flex;height:100vh;overflow:hidden;box-sizing:border-box;background:radial-gradient(circle at 15% 15%,rgba(99,102,241,.35),transparent 45%),radial-gradient(circle at 85% 85%,rgba(16,185,129,.22),transparent 45%),#0b0f19;background-repeat:no-repeat}

.test-badge{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;z-index:10000;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#000;background:#f59e0b;box-shadow:0 6px 18px rgba(245,158,11,.4);pointer-events:none}

/* ===== صفحة الدخول ===== */
#login{position:fixed;inset:0;z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px;box-sizing:border-box;overflow-y:auto;background:radial-gradient(circle at 15% 15%,rgba(99,102,241,.35),transparent 45%),radial-gradient(circle at 85% 85%,rgba(16,185,129,.22),transparent 45%),#0b0f19}
.lcard{width:100%;max-width:400px;padding:36px 28px 28px;box-sizing:border-box;border-radius:24px;text-align:center;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gbd);box-shadow:0 25px 60px rgba(0,0,0,.45);animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.logo{width:68px;height:68px;margin:0 auto 18px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 10px 30px rgba(99,102,241,.45)}
.lcard h2{margin:0 0 6px;font-size:24px}.sub{color:var(--mut);font-size:14px;margin-bottom:26px}
.field{position:relative;margin-bottom:14px;text-align:right}
.ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut);pointer-events:none}
.field input{margin:0;padding:14px 44px}
.eye,.eye:hover{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px 8px;background:none;box-shadow:none;font-size:16px;line-height:1}
.lbtn{margin:8px 0 0;padding:14px;font-size:15px}
#err{min-height:20px;margin-top:14px;font-size:13px;color:#f87171}

/* ===== الشاشة الرئيسية ===== */
.home{width:100%;max-width:560px;text-align:center}
.home h1{font-size:28px;margin:0 0 4px}
.hello{color:var(--mut);font-size:14px;margin-bottom:26px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px}
.tile{padding:28px 18px;border-radius:24px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gbd);box-shadow:0 25px 60px rgba(0,0,0,.45);cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;animation:in .5s ease both}
.tile:hover{transform:translateY(-4px);border-color:var(--pr);box-shadow:0 30px 60px rgba(99,102,241,.25)}
.t-ico{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 10px 30px rgba(99,102,241,.45)}
.tile.exp .t-ico{background:linear-gradient(135deg,#f59e0b,#ef4444);box-shadow:0 10px 30px rgba(245,158,11,.4)}
.t-name{font-size:20px;font-weight:700;margin-bottom:6px}
.t-sum{font-size:13px;color:var(--mut);line-height:1.8}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btns button{width:auto;padding:10px 20px;margin:0}

/* ===== الداخل ===== */
.sidebar{width:280px;background:rgba(17,24,39,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid var(--gbd);padding:20px;display:none;flex-direction:column;box-sizing:border-box;flex-shrink:0;overflow-y:auto}
.plist{flex:1;overflow-y:auto;margin-bottom:10px}
.item{padding:12px 14px;background:rgba(15,23,42,.45);border:1px solid var(--gbd);border-radius:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;transition:all .2s}
.item:hover{border-color:var(--pr);background:rgba(99,102,241,.1)}
.item.active{border-color:var(--pr);background:rgba(99,102,241,.22);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.badge{padding:4px 8px;border-radius:6px;font-weight:600;font-size:11px;color:#fff}
.g{background:#10b981}.y{background:#f59e0b;color:#000}.r{background:#ef4444}.n{background:#6366f1}
.main{flex:1;display:flex;justify-content:center;align-items:center;padding:15px;overflow-y:auto;box-sizing:border-box}
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:28px 22px;border-radius:24px;border:1px solid var(--gbd);box-shadow:0 25px 60px rgba(0,0,0,.45);text-align:center;width:100%;max-width:480px;box-sizing:border-box;animation:in .5s ease both}
.big{font-size:60px;font-weight:800;color:#10b981;margin:6px 0 12px;text-shadow:0 0 30px rgba(16,185,129,.35)}
.big.amber{color:#fbbf24;text-shadow:0 0 30px rgba(251,191,36,.35);margin:6px 0 4px}
.big small{font-size:18px;font-weight:600;color:var(--mut)}
.prog{height:8px;border-radius:99px;background:rgba(148,163,184,.18);overflow:hidden;margin:0 0 8px}
.prog i{display:block;height:100%;border-radius:99px;transition:width .6s ease,background .3s}
.prog-txt{font-size:12px;color:var(--mut)}
.end{font-size:13px;color:var(--prl);margin:8px 0 14px}
.note-view{display:none;margin:6px 0 4px;padding:14px 18px;text-align:center;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.28);border-radius:16px;font-size:16px;line-height:1.8;color:#e2e8f0;white-space:pre-wrap;word-break:break-word}
.clock{margin-top:18px;padding-top:16px;border-top:1px solid var(--gbd)}
.c-day{font-size:22px;font-weight:700;color:var(--prl)}
.c-date{font-size:15px;color:var(--mut);margin:2px 0 8px}
.c-time{font-size:36px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.c-time small{font-size:16px;font-weight:600;color:var(--mut);margin-right:6px}
.admin-box{display:none;position:relative;margin-top:18px;text-align:right;background:rgba(11,15,25,.45);border:1px solid var(--gbd);padding:14px;border-radius:16px}
.ab-head{font-size:14px;color:var(--mut);margin:0 0 12px;padding-left:44px}
.ab-head b{color:#fff}
.x{position:absolute;left:10px;top:10px;width:auto;margin:0;padding:4px 11px;font-size:14px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.elist{max-height:340px;overflow-y:auto;margin-top:14px}
.erow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(15,23,42,.45);border:1px solid var(--gbd);border-radius:12px;margin-bottom:8px;text-align:right}
.e-main{flex:1;min-width:0}
.e-main b{display:block;font-size:14px;word-break:break-word}
.e-main span{font-size:12px;color:var(--mut)}
.e-amt{font-weight:700;color:#fbbf24;white-space:nowrap;font-variant-numeric:tabular-nums}
.erow button{width:auto;margin:0;padding:3px 9px;font-size:13px}
.empty{color:var(--mut);font-size:13px;padding:14px 0}
.hint{font-size:12px;color:var(--mut);margin:-2px 0 10px;line-height:1.7}

input,select,button,textarea{width:100%;padding:12px 14px;margin-bottom:10px;background:rgba(11,15,25,.7);border:1px solid var(--bd);color:#fff;border-radius:12px;box-sizing:border-box;font-size:14px;font-family:inherit;transition:border-color .2s,box-shadow .2s,transform .15s}
textarea{min-height:80px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px rgba(99,102,241,.25)}
option{background:#0b0f19}
button{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;cursor:pointer;font-weight:600;box-shadow:0 8px 22px rgba(99,102,241,.35)}
button:hover{background:linear-gradient(135deg,#4f46e5,#7c3aed);transform:translateY(-1px);box-shadow:0 12px 28px rgba(99,102,241,.45)}
button:active{transform:none}
button:disabled{opacity:.6;cursor:wait}
.sec{background:rgba(51,65,85,.75);box-shadow:none}.sec:hover{background:rgba(71,85,105,.85);box-shadow:none}
.dng{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 8px 22px rgba(239,68,68,.3)}.dng:hover{background:linear-gradient(135deg,#dc2626,#b91c1c);box-shadow:0 12px 28px rgba(239,68,68,.4)}
@media(max-width:768px){
body{flex-direction:column;height:auto;min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-y:auto}
.main{order:1;flex:none;padding:12px;align-items:flex-start;overflow:visible}
.sidebar{order:2;flex:none;width:100%;overflow-y:visible;padding:15px;border-left:none;border-top:1px solid var(--gbd)}
.plist{flex:none;max-height:220px}.card{padding:22px 16px}.big{font-size:48px}.c-time{font-size:32px}
input,select,button,textarea{font-size:16px}.lcard{padding:30px 20px 22px}}
</style>
</head>
<body>

<div class="test-badge">🧪 نسخة تجريبية</div>

<div id="login"><div class="lcard" id="lcard" style="visibility:hidden">
<div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
<h2>مرحباً بك</h2><div class="sub">سجّل دخولك للمتابعة</div>
<div class="field"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><input type="text" id="lu" placeholder="اسم المستخدم" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
<div class="field"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input type="password" id="lp" placeholder="كلمة المرور" autocomplete="current-password"><button type="button" class="eye" data-act="eye" aria-label="إظهار كلمة المرور">👁️</button></div>
<button class="lbtn" data-act="login">دخول</button>
<div id="err"></div>
</div></div>

<div class="sidebar" id="sidebar">
<div class="item" data-act="home" style="justify-content:center;font-weight:600">🏠 الرئيسية</div>
<h3 id="sideTitle" style="color:var(--prl);text-align:center;margin:6px 0 12px">الاشتراكات</h3>
<div class="plist" id="list"></div>
<div id="adminMenu" style="display:none;border-top:1px solid var(--gbd);padding-top:10px;margin-top:auto;flex-direction:column;gap:6px">
<div class="item" data-act="view" data-tab="create"><span>➕ إنشاء اشتراك جديد</span></div>
</div>
<button class="sec" data-act="logout" style="margin-top:8px;margin-bottom:0">تسجيل خروج</button>
</div>

<div class="main">

<div class="home" id="vHome">
<h1>🏠 الرئيسية</h1>
<div class="hello" id="hello"></div>
<div class="tiles">
<div class="tile" data-act="open" data-sec="subs"><div class="t-ico">🔔</div><div class="t-name">الاشتراكات</div><div class="t-sum" id="sumSubs"></div></div>
<div class="tile exp" data-act="open" data-sec="exp"><div class="t-ico">💸</div><div class="t-name">الصرفيات</div><div class="t-sum" id="sumExp"></div></div>
</div>
<div class="btns">
<button class="sec" id="homeSet" data-act="open" data-sec="settings" style="display:none">⚙️ إدارة المستخدمين</button>
<button class="sec" data-act="logout">تسجيل خروج</button>
</div>
</div>

<div class="card" id="vCount">
<div style="color:var(--mut);font-size:14px">الأيام المتبقية</div>
<div class="big" id="days">0</div>
<div class="prog"><i id="progBar"></i></div>
<div class="prog-txt" id="progTxt"></div>
<div class="end" id="endTxt"></div>
<div class="note-view" id="noteView"></div>

<div class="clock" id="clockBox">
<div class="c-day" id="cDay"></div>
<div class="c-date" id="cDate"></div>
<div class="c-time" id="cTime"></div>
</div>

<div id="adminBox" class="admin-box">
<button class="sec x" data-act="closePanel" aria-label="إغلاق">✕</button>
<div class="ab-head">تعديل الاشتراك: <b id="pName"></b></div>
<label style="font-size:12px;color:var(--mut);display:block;margin-bottom:6px">تعديل الأيام:</label>
<div style="display:flex;gap:8px"><input type="number" id="dIn" min="1" max="365" style="margin-bottom:0"><button data-act="setDays" style="width:100px;margin-bottom:0">تعيين</button></div>
<label style="font-size:12px;color:var(--mut);display:block;margin:12px 0 6px">النص الذي يظهر تحت الأيام:</label>
<textarea id="noteIn" placeholder="اكتب هنا..."></textarea>
<button class="sec" data-act="saveNote">حفظ النص</button>
<div style="display:flex;gap:8px"><button class="sec" data-act="rename" style="margin-bottom:0">إعادة تسمية</button><button class="dng" data-act="delP" style="margin-bottom:0">حذف</button></div>
</div>
</div>

<div class="card" id="vCreate" style="display:none;text-align:right">
<h2 style="color:var(--prl);text-align:center;margin-top:0">إنشاء اشتراك جديد</h2>
<input type="text" id="nName" placeholder="اسم الاشتراك..." autocomplete="off">
<input type="number" id="nDays" min="1" max="365" value="92">
<textarea id="nNote" placeholder="نص يظهر تحت الأيام (اختياري)..."></textarea>
<button data-act="create">إنشاء وحفظ</button>
<button class="sec" data-act="view" data-tab="countdown">إلغاء</button>
</div>

<div class="card" id="vExp" style="display:none">
<div style="color:var(--mut);font-size:14px">مجموع الصرفيات خلال شهر</div>
<h2 id="eMonth" style="color:var(--prl);margin:4px 0 0"></h2>
<div class="big amber"><span id="eTotal">0</span> <small id="eCur"></small></div>
<div class="prog-txt" id="eCount"></div>

<div id="eAdd" class="admin-box" style="margin-top:16px">
<input type="text" id="xName" placeholder="اسم الصرفية..." autocomplete="off">
<div class="two">
<input type="date" id="xDate">
<input type="number" id="xAmt" min="0" step="any" inputmode="decimal" placeholder="المبلغ">
</div>
<button data-act="addExp" style="margin-bottom:0">➕ إضافة صرفية</button>
</div>

<div class="elist" id="eList"></div>
</div>

<div class="card" id="vSettings" style="display:none;text-align:right">
<h2 style="color:var(--prl);text-align:center;margin-top:0">إدارة المستخدمين</h2>
<input type="text" id="nUser" placeholder="اسم المستخدم (إنجليزي)" autocomplete="off" autocapitalize="none" spellcheck="false">
<input type="password" id="nPass" placeholder="كلمة المرور (6 خانات على الأقل)" autocomplete="new-password">
<select id="nRole"><option value="viewer">مُشاهد (قراءة فقط)</option><option value="admin">مدير (تحكم كامل)</option></select>
<div class="hint">اسم المستخدم: حروف إنجليزية صغيرة وأرقام فقط (3 إلى 20).</div>
<button data-act="addUser" id="addUserBtn">حفظ المستخدم</button>
<div id="ulist" style="max-height:180px;overflow-y:auto;margin-top:10px"></div>
<button class="sec" data-act="home" style="margin-top:10px">العودة للرئيسية</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBraw98K7uLeQ5p7xmgn88x2jczO2EtzXM",
  authDomain: "jawharat-al-zaman-company.firebaseapp.com",
  projectId: "jawharat-al-zaman-company",
  storageBucket: "jawharat-al-zaman-company.firebasestorage.app",
  messagingSenderId: "117069348206",
  appId: "1:117069348206:web:1d8e3c9c365557d02b557f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
// تطبيق ثانوي فقط لإنشاء حسابات جديدة بدون ما يطلع المدير من حسابه
const auth2 = getAuth(initializeApp(firebaseConfig, 'secondary'));

// ===== بيانات النسخة التجريبية =====
const profilesRef = doc(db, 'app', 'profiles_test');
const expensesRef = doc(db, 'app', 'expenses_test');
const membersCol = collection(db, 'members');
const EMAIL_DOMAIN = 'jawharat.app';
const toEmail = u => `${u}@${EMAIL_DOMAIN}`;
const CUR = 'د.ع';

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });

// ===== التواريخ =====
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const monthName = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('ar-IQ', { month: 'long' }) + ' ' + y; };
const dn = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
const fmtDate = d => `${d.toLocaleDateString('ar-IQ', { weekday: 'long' })} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
const fmtISO = s => { const [y, m, d] = s.split('-').map(Number); return fmtDate(new Date(y, m - 1, d)); };

// ===== الاشتراكات =====
const total = p => p.maxDays ?? p.days;
const left = p => Math.max(0, total(p) - Math.max(0, dn(today()) - dn(p.start || today())));
const cls = d => d > 20 ? 'g' : d > 10 ? 'y' : 'r';
const barColor = { g: '#10b981', y: '#f59e0b', r: '#ef4444' };
function endText(p) {
  const [y, m, d] = (p.start || today()).split('-').map(Number);
  const e = new Date(y, m - 1, d + total(p));
  return (left(p) <= 0 ? 'انتهى الاشتراك يوم ' : 'ينتهي يوم ') + fmtDate(e);
}

// ===== الصرفيات =====
const monthItems = k => (exps || []).filter(e => e.date.startsWith(k)).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
const sum = items => items.reduce((s, e) => s + e.amount, 0);

// ===== الحالة =====
let me = null;                 // { uid, name, role } بعد تسجيل الدخول
let authReady = false;
let data = null, exps = null, members = [];
let current = null, tab = 'countdown', panelOpen = false, section = 'home';
let curMonth = monthKey(new Date());
let unsubs = [];
const isAdmin = () => me?.role === 'admin';

const saveData = () => setDoc(profilesRef, { data }).catch(showError);
const saveExps = () => setDoc(expensesRef, { list: exps }).catch(showError);

let alerted = false;
function showError(e) {
  console.error(e);
  const msg = 'خطأ بالاتصال بقاعدة البيانات: ' + (e.code || e.message);
  $('err').textContent = msg;
  if (me && data === null) signOut(auth);          // فشل تحميل البيانات: رجّعه لصفحة الدخول مع الرسالة
  else if (!alerted) { alerted = true; alert(msg); }
}

// ===== الاستماع للبيانات (يبدأ بعد تسجيل الدخول فقط) =====
function startListeners() {
  stopListeners();
  unsubs.push(onSnapshot(profilesRef, snap => {
    if (snap.exists()) data = snap.data().data || {};
    else {
      data = {};
      if (isAdmin()) { data = { 'الهدف الأساسي': { days: 92, maxDays: 92, start: today(), note: '' } }; saveData(); }
    }
    if (isAdmin()) {
      let ch = false;
      for (const n in data) if (!data[n].start) { data[n].start = today(); ch = true; }
      if (ch) saveData();
    }
    if (!current || !data[current]) current = Object.keys(data)[0] || null;
    render();
  }, showError));
  unsubs.push(onSnapshot(expensesRef, snap => {
    exps = snap.exists() ? (snap.data().list || []) : [];
    render();
  }, showError));
  if (isAdmin()) unsubs.push(onSnapshot(membersCol, snap => {
    members = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, showError));
}
function stopListeners() {
  unsubs.forEach(f => f()); unsubs = [];
  data = null; exps = null; members = []; current = null;
}

// ===== حالة تسجيل الدخول =====
onAuthStateChanged(auth, async u => {
  if (!u) {
    stopListeners(); me = null; authReady = true; section = 'home'; tab = 'countdown'; panelOpen = false;
    render(); return;
  }
  try {
    const m = await getDoc(doc(db, 'members', u.uid));
    if (!m.exists()) {
      $('err').textContent = 'حسابك غير مفعّل بالنظام، تواصل مع المدير';
      await signOut(auth); return;
    }
    me = { uid: u.uid, ...m.data() };
    authReady = true; section = 'home';
    startListeners(); render();
  } catch (e) { showError(e); await signOut(auth); }
});

const authMsg = e => ({
  'auth/invalid-credential': 'اسم المستخدم أو كلمة المرور غير صحيحة!',
  'auth/wrong-password': 'اسم المستخدم أو كلمة المرور غير صحيحة!',
  'auth/user-not-found': 'اسم المستخدم أو كلمة المرور غير صحيحة!',
  'auth/invalid-email': 'اسم المستخدم غير صالح',
  'auth/too-many-requests': 'محاولات كثيرة، انتظر قليلاً وحاول مرة ثانية',
  'auth/network-request-failed': 'تأكد من اتصال الإنترنت'
}[e.code] || 'تعذّر تسجيل الدخول: ' + (e.code || e.message));

async function login() {
  const u = $('lu').value.trim().toLowerCase(), p = $('lp').value;
  if (!u || !p) { $('err').textContent = 'أدخل اسم المستخدم وكلمة المرور'; return; }
  $('err').textContent = 'جاري الدخول...';
  try { await signInWithEmailAndPassword(auth, toEmail(u), p); $('lp').value = ''; }
  catch (e) { $('err').textContent = authMsg(e); }
}

// ===== الساعة الحية =====
let lastDay = today();
function tick() {
  const n = new Date();
  const h = n.getHours(), ap = h >= 12 ? 'م' : 'ص', h12 = h % 12 || 12;
  $('cDay').textContent = n.toLocaleDateString('ar-IQ', { weekday: 'long' });
  $('cDate').textContent = `${pad(n.getDate())}/${pad(n.getMonth() + 1)}/${n.getFullYear()}`;
  $('cTime').innerHTML = `<span dir="ltr">${h12}:${pad(n.getMinutes())}:${pad(n.getSeconds())}</span><small>${ap}</small>`;
  if (today() !== lastDay) { lastDay = today(); render(); }
}
setInterval(tick, 1000);
tick();
$('xDate').value = today();

function render() {
  const loading = !authReady || (me && data === null);
  $('lcard').style.visibility = loading ? 'hidden' : 'visible';
  if (loading || !me) { $('login').style.display = 'flex'; return; }
  $('login').style.display = 'none';

  const adm = isAdmin();
  if (!adm) { if (section === 'settings') section = 'home'; tab = 'countdown'; panelOpen = false; }
  const inSubs = section === 'subs', inExp = section === 'exp';
  const showPanel = adm && inSubs && tab === 'countdown' && panelOpen && !!current;

  $('sidebar').style.display = (inSubs || inExp) ? 'flex' : 'none';
  $('vHome').style.display = section === 'home' ? 'block' : 'none';
  $('vCount').style.display = inSubs && tab === 'countdown' ? 'block' : 'none';
  $('vCreate').style.display = inSubs && adm && tab === 'create' ? 'block' : 'none';
  $('vExp').style.display = inExp ? 'block' : 'none';
  $('vSettings').style.display = section === 'settings' && adm ? 'block' : 'none';
  $('adminBox').style.display = showPanel ? 'block' : 'none';
  $('clockBox').style.display = showPanel ? 'none' : 'block';
  $('adminMenu').style.display = inSubs && adm ? 'flex' : 'none';
  $('homeSet').style.display = adm ? 'inline-block' : 'none';
  $('eAdd').style.display = adm ? 'block' : 'none';
  $('sideTitle').textContent = inExp ? 'الصرفيات' : 'الاشتراكات';

  // الرئيسية
  $('hello').innerHTML = `مرحباً، <b>${esc(me.name)}</b>`;
  const names = Object.keys(data), soon = names.filter(n => left(data[n]) <= 10).length;
  $('sumSubs').innerHTML = `${names.length} اشتراك` + (soon ? `<br><span style="color:#fbbf24">⚠️ ${soon} ينتهي قريباً</span>` : '');
  const cm = monthKey(new Date());
  $('sumExp').innerHTML = `${esc(monthName(cm))}<br><b style="color:#fbbf24">${fmt(sum(monthItems(cm)))} ${CUR}</b>`;

  // المستخدمون
  if (adm) $('ulist').innerHTML = members.map(m =>
    `<div class="item"><span><b>${esc(m.name)}</b> (${m.role === 'admin' ? 'مدير' : 'مُشاهد'})</span>` +
    (m.id !== me.uid
      ? `<button class="dng" data-act="delUser" data-id="${esc(m.id)}" data-name="${esc(m.name)}" style="width:auto;padding:2px 8px;margin:0">حذف</button>`
      : '<span style="font-size:11px;color:var(--mut)">أنت</span>') + '</div>').join('');

  // القائمة الجانبية
  if (inSubs) {
    $('list').innerHTML = names.length ? names.map(n => {
      const l = left(data[n]);
      return `<div class="item ${n === current && tab === 'countdown' ? 'active' : ''}" data-act="sel" data-name="${esc(n)}"><span style="font-weight:500">${esc(n)}</span><span class="badge ${cls(l)}">${l} يوم</span></div>`;
    }).join('') : '<div class="empty" style="text-align:center">لا توجد اشتراكات</div>';
  } else if (inExp) {
    const ms = new Set((exps || []).map(e => e.date.slice(0, 7)));
    ms.add(monthKey(new Date())); ms.add(curMonth);
    $('list').innerHTML = [...ms].sort().reverse().map(m =>
      `<div class="item ${m === curMonth ? 'active' : ''}" data-act="selMonth" data-m="${m}"><span style="font-weight:500">${esc(monthName(m))}</span><span class="badge n">${fmt(sum(monthItems(m)))}</span></div>`).join('');
  }

  // الاشتراك المختار
  const p = current && data[current];
  if (p) {
    const l = left(p), t = total(p), passed = t - l;
    $('days').textContent = l;
    $('progBar').style.width = (t > 0 ? Math.min(100, passed / t * 100) : 0) + '%';
    $('progBar').style.background = barColor[cls(l)];
    $('progTxt').textContent = `مضى ${passed} من ${t} يوم`;
    $('endTxt').textContent = endText(p);
    const note = (p.note || '').trim();
    $('noteView').textContent = note;
    $('noteView').style.display = note ? 'block' : 'none';
    $('pName').textContent = current;
    if (document.activeElement !== $('dIn')) $('dIn').value = t;
    if (document.activeElement !== $('noteIn')) $('noteIn').value = p.note || '';
  } else {
    $('days').textContent = '—'; $('progBar').style.width = '0';
    $('progTxt').textContent = ''; $('endTxt').textContent = ''; $('noteView').style.display = 'none';
  }

  // الصرفيات
  if (inExp) {
    const items = monthItems(curMonth);
    $('eMonth').textContent = monthName(curMonth);
    $('eTotal').textContent = fmt(sum(items));
    $('eCur').textContent = CUR;
    $('eCount').textContent = items.length ? `${items.length} صرفية خلال الشهر` : 'لا توجد صرفيات بهذا الشهر';
    $('eList').innerHTML = items.length ? items.map(e =>
      `<div class="erow"><div class="e-main"><b>${esc(e.name)}</b><span>${esc(fmtISO(e.date))}</span></div><div class="e-amt">${fmt(e.amount)} ${CUR}</div>` +
      (adm ? `<button class="dng" data-act="delExp" data-id="${e.id}" aria-label="حذف">✕</button>` : '') + '</div>').join('')
      : '<div class="empty">ما توجد صرفيات لهذا الشهر بعد</div>';
  }
}

const act = {
  login,
  eye(el) { const i = $('lp'); i.type = i.type === 'password' ? 'text' : 'password'; el.textContent = i.type === 'password' ? '👁️' : '🙈'; },
  logout() { $('err').textContent = ''; signOut(auth); },
  home() { section = 'home'; tab = 'countdown'; panelOpen = false; render(); },
  open(el) {
    section = el.dataset.sec; tab = 'countdown'; panelOpen = false;
    if (section === 'exp') curMonth = monthKey(new Date());
    render();
  },
  view(el) { tab = el.dataset.tab; panelOpen = false; render(); },

  // --- الاشتراكات ---
  sel(el) {
    const n = el.dataset.name;
    if (isAdmin() && tab === 'countdown' && current === n) panelOpen = !panelOpen;
    else { current = n; tab = 'countdown'; panelOpen = isAdmin(); }
    render();
  },
  closePanel() { panelOpen = false; render(); },
  setDays() {
    const v = parseInt($('dIn').value); if (isNaN(v) || !current) return;
    data[current] = { ...data[current], days: v, maxDays: v, start: today() };
    saveData(); render();
  },
  saveNote(el) {
    if (!current) return;
    data[current].note = $('noteIn').value.trim();
    saveData(); render();
    el.textContent = 'تم الحفظ ✓';
    setTimeout(() => { el.textContent = 'حفظ النص'; }, 1500);
  },
  rename() {
    if (!current) return;
    let n = prompt('الاسم الجديد للاشتراك:', current);
    if (!n || !n.trim()) return; n = n.trim();
    if (data[n]) return alert('الاسم موجود مسبقاً');
    data[n] = data[current]; delete data[current]; current = n;
    saveData(); render();
  },
  delP() {
    if (!current) return;
    if (confirm(`حذف اشتراك ${current}؟`)) { delete data[current]; current = Object.keys(data)[0] || null; panelOpen = false; saveData(); render(); }
  },
  create() {
    const n = $('nName').value.trim(), d = parseInt($('nDays').value);
    if (!n || isNaN(d)) return alert('أدخل بيانات صحيحة');
    if (data[n]) return alert('الاشتراك موجود مسبقاً');
    data[n] = { days: d, maxDays: d, start: today(), note: $('nNote').value.trim() };
    current = n; $('nName').value = ''; $('nNote').value = ''; tab = 'countdown'; panelOpen = false;
    saveData(); render();
  },

  // --- الصرفيات ---
  selMonth(el) { curMonth = el.dataset.m; render(); },
  addExp() {
    if (!isAdmin()) return;
    const name = $('xName').value.trim(), date = $('xDate').value, amt = parseFloat($('xAmt').value);
    if (!name || !date || isNaN(amt) || amt < 0) return alert('أدخل الاسم والتاريخ والمبلغ بشكل صحيح');
    if (exps === null) return alert('جاري تحميل البيانات، حاول بعد ثواني');
    exps.push({ id: Date.now(), name, date, amount: amt });
    curMonth = date.slice(0, 7);
    $('xName').value = ''; $('xAmt').value = '';
    saveExps(); render(); $('xName').focus();
  },
  delExp(el) {
    if (!isAdmin()) return;
    const id = Number(el.dataset.id);
    if (confirm('حذف هذي الصرفية؟')) { exps = exps.filter(e => e.id !== id); saveExps(); render(); }
  },

  // --- المستخدمون (للمدير فقط) ---
  async addUser() {
    if (!isAdmin()) return;
    const u = $('nUser').value.trim().toLowerCase(), p = $('nPass').value, role = $('nRole').value;
    if (!/^[a-z0-9._-]{3,20}$/.test(u)) return alert('اسم المستخدم: حروف إنجليزية صغيرة وأرقام فقط (3 إلى 20 خانة)');
    if (p.length < 6) return alert('كلمة المرور 6 خانات على الأقل');
    const btn = $('addUserBtn'); btn.disabled = true;
    try {
      const cred = await createUserWithEmailAndPassword(auth2, toEmail(u), p);
      await setDoc(doc(db, 'members', cred.user.uid), { name: u, role });
      await signOut(auth2);
      $('nUser').value = ''; $('nPass').value = '';
      alert('تم حفظ المستخدم بنجاح!');
    } catch (e) {
      console.error(e);
      alert(e.code === 'auth/email-already-in-use'
        ? 'هذا المستخدم موجود مسبقاً بنظام الدخول. إذا حذفته سابقاً، احذف حسابه من Firebase ← Authentication ← Users ثم أعد المحاولة.'
        : e.code === 'auth/weak-password' ? 'كلمة المرور ضعيفة، اختر كلمة أقوى'
        : 'تعذّر إنشاء المستخدم: ' + (e.code || e.message));
    } finally { btn.disabled = false; }
  },
  async delUser(el) {
    if (!isAdmin() || el.dataset.id === me.uid) return;
    if (!confirm(`حذف المستخدم ${el.dataset.name}؟ راح يفقد الدخول فوراً.`)) return;
    try { await deleteDoc(doc(db, 'members', el.dataset.id)); }
    catch (e) { showError(e); }
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && act[el.dataset.act]) act[el.dataset.act](el);
});
['lu', 'lp'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') login(); }));
['xName', 'xAmt'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') act.addExp(); }));
</script>
</body>
</html>
